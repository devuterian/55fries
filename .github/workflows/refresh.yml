name: daily-refresh

on:
  schedule:
    - cron: "0 21 * * *" # 매일 06:00 KST
  workflow_dispatch:
    inputs:
      days:
        description: "수집 기간(일). 판매완료 기록을 다시 채울 때만 180"
        default: "25"
  pull_request:
    paths:
      - scripts/collect_marketplaces.py
      - scripts/daily_refresh.py
      - .github/workflows/refresh.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: GitHub 러너에서 두 마켓 API가 열리는지 확인
        run: |
          python3 scripts/collect_marketplaces.py /tmp/smoke.json --run-id smoke \
            --models "Ricoh GR III" "RTX 5060" --joongna-pages 1 --bunjang-pages 1
          python3 scripts/normalize_mcp_refresh.py /tmp/smoke.json /tmp/smoke-import.json

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r requirements-dev.txt
      - name: 수집과 정규화
        run: python3 scripts/daily_refresh.py --days "${{ inputs.days || '25' }}"
      - name: DB 재생성과 사이트 빌드
        run: |
          make build
          make test
          make verify
      - name: 원본 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: var/raw/
          retention-days: 30
          if-no-files-found: ignore
      - name: 커밋하고 배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data dist
          if git diff --cached --quiet; then
            echo "바뀐 데이터가 없습니다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          message="data: 자동 갱신 $(TZ=Asia/Seoul date +%F)"
          git commit -m "$message"
          # 수집하는 동안 main에 다른 커밋이 들어오면 push가 거절된다.
          # dist는 합칠 수 없으니 최신 main 위에 수집 결과(imports·aggregates)만 다시 얹고 새로 빌드한다.
          for attempt in 1 2 3; do
            if git push; then
              pushed=1
              break
            fi
            echo "push 거절됨(${attempt}회): 최신 main 위에 다시 빌드합니다"
            rm -rf /tmp/collected && mkdir -p /tmp/collected
            cp -R data/imports data/aggregates /tmp/collected/
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            rm -rf data/imports data/aggregates
            cp -R /tmp/collected/imports /tmp/collected/aggregates data/
            make build
            make test
            make verify
            git add -A data dist
            if git diff --cached --quiet; then
              echo "다시 빌드해 보니 바뀐 데이터가 없습니다"
              exit 0
            fi
            git commit -m "$message"
          done
          if [ -z "${pushed:-}" ]; then
            echo "push 3회 실패" >&2
            exit 1
          fi
          # GITHUB_TOKEN으로 한 push는 다른 워크플로를 깨우지 않으므로 배포를 직접 부른다
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
