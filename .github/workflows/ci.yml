name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 scripts/validate_json.py
      - run: python3 scripts/manage_db.py --db /tmp/55fries.sqlite bootstrap
      - run: python3 scripts/manage_db.py --db /tmp/55fries.sqlite build --output /tmp/55fries-site
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/manage_db.py --db /tmp/55fries.sqlite verify
